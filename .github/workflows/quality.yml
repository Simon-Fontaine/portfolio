name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, type-check and test (content, i18n, CV rendering)
        run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Build (also generates both CVs)
        run: npm run build
      - name: Upload the generated CVs
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: public/cv/*.pdf
          if-no-files-found: error
